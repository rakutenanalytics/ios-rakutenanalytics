# Sample apps: inherit repo rules; keep slightly stricter line length for UI code.
parent_config: ../.swiftlint.yml

line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

function_parameter_count:
  warning: 13
  error: 14

disabled_rules:
  - unused_optional_binding
